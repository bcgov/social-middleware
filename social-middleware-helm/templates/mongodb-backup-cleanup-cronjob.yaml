{{- if or (hasSuffix "-prod" .Release.Namespace) (hasSuffix "-test" .Release.Namespace) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    component: backup-cleanup
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM (after backup completes)
  timeZone: {{ .Values.mongodb.backup.timeZone | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: mongodb-backup-cleanup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: {{ .Values.mongodb.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  DAILY={{ .Values.mongodb.backup.daily }}
                  WEEKLY={{ .Values.mongodb.backup.weekly }}
                  MONTHLY={{ .Values.mongodb.backup.monthly }}

                  echo "Rolling retention: daily=$DAILY weekly=$WEEKLY monthly=$MONTHLY"

                  # Count-based rather than age-based on purpose: a run of failed
                  # backups must not be able to age out the copies still on disk.
                  prune_tier() {
                    tier="$1"; keep="$2"
                    [ -d "/backup/$tier" ] || { echo "  $tier: none yet"; return 0; }
                    cd "/backup/$tier"
                    total=$(ls -1d */ 2>/dev/null | wc -l)
                    if [ "$total" -gt "$keep" ]; then
                      n=$((total - keep))
                      echo "  $tier: $total present, deleting $n oldest"
                      ls -1dt */ | tail -n "$n" | xargs rm -rf
                    else
                      echo "  $tier: $total present, keeping all (limit $keep)"
                    fi
                  }

                  prune_tier daily   "$DAILY"
                  prune_tier weekly  "$WEEKLY"
                  prune_tier monthly "$MONTHLY"

                  # Transitional: before rolling tiers, dumps were written flat
                  # into /backup/<timestamp>/. Age those out on the daily limit
                  # so nothing is discarded abruptly. Once none remain this block
                  # is a no-op and can be deleted.
                  cd /backup
                  legacy=$(ls -1d 20*/ 2>/dev/null | wc -l)
                  if [ "$legacy" -gt 0 ]; then
                    echo "  legacy (flat layout): $legacy present"
                    if [ "$legacy" -gt "$DAILY" ]; then
                      n=$((legacy - DAILY))
                      echo "  legacy: deleting $n oldest"
                      ls -1dt 20*/ | tail -n "$n" | xargs rm -rf
                    fi
                  fi

                  echo "Remaining:"
                  du -sh /backup/daily /backup/weekly /backup/monthly 2>/dev/null || true
                  echo "Disk usage:"
                  df -h /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                limits:
                  cpu: "100m"
                  memory: 128Mi
                requests:
                  cpu: "10m"
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: mongodb-backup
{{- end }}
