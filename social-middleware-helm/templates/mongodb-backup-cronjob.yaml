{{- if or (hasSuffix "-prod" .Release.Namespace) (hasSuffix "-test" .Release.Namespace) }}
{{- $pod := .Values.mongodb.podlabel }}
{{- $port := .Values.mongodb.port }}
{{- $ns := .Release.Namespace }}
{{- $hosts := list }}
{{- range $i := until (int .Values.mongodb.replicaSet.replicas) }}
{{- $hosts = append $hosts (printf "%s-%d.%s.%s.svc.cluster.local:%v" $pod $i $pod $ns $port) }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  timeZone: {{ .Values.mongodb.backup.timeZone | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: mongodb-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.mongodb.podlabel }}-sa
          containers:
            - name: mongodump
              image: {{ .Values.mongodb.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  # Each night's dump is filed into exactly one tier, not copied
                  # into several. The cleanup job then prunes each tier to its
                  # own depth, which is what makes the retention "rolling".
                  if [ "$(date -d tomorrow +%d)" = "01" ]; then
                    TIER=monthly
                  elif [ "$(date +%u)" = "7" ]; then
                    TIER=weekly
                  else
                    TIER=daily
                  fi

                  BACKUP_DIR="/backup/$TIER/$(date +%Y%m%d-%H%M%S)"
                  echo "Starting MongoDB backup to $BACKUP_DIR (tier: $TIER)"
                  mkdir -p "$BACKUP_DIR"

                  # Addressed as a replica set rather than through the Service so
                  # that --readPreference is honoured. Backups read from a
                  # secondary, keeping the dump off the primary that is serving
                  # the public site.
                  mongodump \
                    --host="{{ .Values.mongodb.replicaSet.name }}/{{ join "," $hosts }}" \
                    --username=$MONGODB_USER \
                    --password=$MONGODB_PASSWORD \
                    --authenticationDatabase=admin \
                    --db=$MONGODB_DATABASE \
                    --readPreference=secondary \
                    --gzip \
                    --out=$BACKUP_DIR \
                    --ssl \
                    --sslCAFile=/etc/mongodb-ca/service-ca.crt \
                    --sslAllowInvalidHostnames

                  echo "Backup completed successfully"
                  echo "Backup size: $(du -sh $BACKUP_DIR | cut -f1)"
                  echo "Available space: $(df -h /backup | tail -1 | awk '{print $4}')"
              env:
                - name: MONGODB_USER
                  valueFrom:
                    secretKeyRef:
                      name: mongodb
                      key: database-admin-user
                - name: MONGODB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongodb
                      key: database-admin-password
                - name: MONGODB_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: mongodb
                      key: database-name
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: mongodb-ca
                  mountPath: /etc/mongodb-ca
                  readOnly: true
              resources:
                limits:
                  cpu: "500m"
                  memory: 512Mi
                requests:
                  cpu: "100m"
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: mongodb-backup
            - name: mongodb-ca
              configMap:
                name: mongodb-ca-bundle
                defaultMode: 0444
{{- end }}
