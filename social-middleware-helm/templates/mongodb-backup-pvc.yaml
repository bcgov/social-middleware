{{- if or (hasSuffix "-prod" .Release.Namespace) (hasSuffix "-test" .Release.Namespace) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: netapp-file-backup
  resources:
    requests:
      {{- if hasSuffix "-prod" .Release.Namespace }}
      storage: 5Gi
      {{- else }}
      # Test: ~8Mi per dump, ~250Mi at full retention. 2Gi was 9% used and the
      # namespace has a 6Gi total storage quota shared with the data volumes.
      storage: 1Gi
      {{- end }}
{{- end }}
