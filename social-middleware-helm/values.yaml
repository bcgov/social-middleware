nextjs:
  podlabel: social-middleware
  image: image-registry.openshift-image-registry.svc:5000/f6e00d-tools/nextjs:latest
  port: 3001
  replicas: 1
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  dev:
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
      requests:
        cpu: "20m"
        memory: 128Mi
  prod:
    resources:
      limits:
        cpu: "1000m"
        memory: 1Gi
      requests:
        cpu: "100m"
        memory: 512Mi

mongodb:
  podlabel: mongodb
  port: 27017
  targetport: 27017
  image: image-registry.openshift-image-registry.svc:5000/f6e00d-tools/mongodb:7-stable
  replicaSet:
    name: rs0
    replicas: 3
  dev:
    resources:
      limits:
        cpu: "300m"
        memory: 512Mi
      requests:
        cpu: "20m"
        memory: 128Mi
    storage:
      size: 700Mi
  test:
    resources:
      limits:
        cpu: "500m"
        memory: 1536Mi
      requests:
        cpu: "100m"
        memory: 512Mi
    storage:
      size: 1Gi
  prod:
    resources:
      limits:
        cpu: "500m"
        memory: 1536Mi
      requests:
        cpu: "100m"
        memory: 512Mi
    storage:
      size: 3Gi
  backup:
    # Kubernetes schedules CronJobs in UTC unless told otherwise, which puts the
    # backup, its cleanup and its verification at times nobody intended and in
    # the wrong order relative to each other.
    timeZone: America/Vancouver
    # Rolling retention. A backup is filed into exactly ONE tier: monthly on the
    # last day of the month, weekly on Sundays, daily otherwise. So "daily: 14"
    # is 14 non-Sunday, non-month-end days - roughly 16 calendar days of cover.
    #
    # At ~34Mi a dump, 14+8+6 is about 950Mi of the 3Gi volume. Revisit if the
    # database grows much beyond its current ~72Mi.
    daily: 14
    weekly: 8
    monthly: 6
    # Freshness window for the verification job, in minutes. 25h so a run that
    # slips slightly does not raise a false alarm.
    maxAgeMinutes: 1500
    # Smallest plausible dump. A "does the directory exist" check passes happily
    # on a truncated or empty backup; a size floor does not.
    minSizeBytes: 5000000
    # Smallest plausible document count across all collections. Catches a dump
    # that is structurally valid but empty - which a size floor alone can miss,
    # since gzip headers and metadata give an empty dump non-zero size.
    minDocuments: 50

redis:
  replicas: 3
  dev:
    resources:
      limits:
        cpu: "300m"
        memory: 512Mi
      requests:
        cpu: "50m"
        memory: 128Mi
    storage:
      size: 100Mi
  prod:
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
      requests:
        cpu: "100m"
        memory: 256Mi
    storage:
      size: 200Mi

nextjsservice:
  port: 80
  targetPort: 3001
